name: Test and deploy
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run format:check
      - run: npm test
      - run: npm run build
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: '21'
      - run: npm exec --yes --package=firebase-tools@15.31.0 -- firebase emulators:exec --only firestore --project demo-tripguessr-review 'npm run test:firestore'
      - run: npx playwright install --with-deps chromium
      - run: npm run test:browser

  deploy:
    name: Deploy production
    needs: check
    if: github.repository == 'wojtke/travelguesser' && github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    timeout-minutes: 20
    concurrency:
      group: tripguessr-production
      cancel-in-progress: false
    environment:
      name: production
      url: https://tripguessr.com
    permissions:
      contents: read
      id-token: write
    env:
      GCP_PROJECT_ID: ${{ vars.GCP_PROJECT_ID }}
      GCP_REGION: ${{ vars.GCP_REGION }}
      CLOUD_RUN_SERVICE: ${{ vars.CLOUD_RUN_SERVICE }}
      GCP_ARTIFACT_REPOSITORY: ${{ vars.GCP_ARTIFACT_REPOSITORY }}
      PUBLIC_URL: ${{ vars.PUBLIC_URL }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Skip superseded commits
        id: current
        shell: bash
        run: |
          if [[ "$(gh api "repos/${GITHUB_REPOSITORY}/commits/main" --jq .sha)" == "$GITHUB_SHA" ]]; then
            echo 'deploy=true' >> "$GITHUB_OUTPUT"
          else
            echo 'A newer main commit exists; this deployment is skipped.'
          fi
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        if: steps.current.outputs.deploy == 'true'
        with:
          node-version: 24
      - name: Build release image
        if: steps.current.outputs.deploy == 'true'
        shell: bash
        run: |
          IMAGE="${GCP_REGION}-docker.pkg.dev/${GCP_PROJECT_ID}/${GCP_ARTIFACT_REPOSITORY}/travelguesser:${GITHUB_SHA}"
          docker build --label "org.opencontainers.image.revision=${GITHUB_SHA}" --tag "$IMAGE" .
          echo "RELEASE_IMAGE=$IMAGE" >> "$GITHUB_ENV"
      - name: Authenticate to Google Cloud
        if: steps.current.outputs.deploy == 'true'
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3
        with:
          project_id: ${{ vars.GCP_PROJECT_ID }}
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GCP_DEPLOY_SERVICE_ACCOUNT }}
      - name: Set up Google Cloud CLI
        if: steps.current.outputs.deploy == 'true'
        uses: google-github-actions/setup-gcloud@aa5489c8933f4cc7a4f7d45035b3b1440c9c10db # v3
      - name: Push release image
        if: steps.current.outputs.deploy == 'true'
        shell: bash
        run: |
          gcloud auth configure-docker "${GCP_REGION}-docker.pkg.dev" --quiet
          docker push "$RELEASE_IMAGE"
          DIGEST="$(gcloud artifacts docker images describe "$RELEASE_IMAGE" --project="$GCP_PROJECT_ID" --format='value(image_summary.digest)')"
          [[ "$DIGEST" =~ ^sha256:[a-f0-9]{64}$ ]]
          echo "DEPLOY_IMAGE=${RELEASE_IMAGE%:*}@${DIGEST}" >> "$GITHUB_ENV"
      - name: Deploy and verify production
        if: steps.current.outputs.deploy == 'true'
        run: bash scripts/deploy-ci.sh
